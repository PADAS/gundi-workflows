name: Main Pipeline
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      python_version:
        description: Python version used to install requirements and run pytest
        type: string
        required: false
        default: '3.8'
      environment:
        required: false
        type: string
        default: dev
      secret_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      branch_filter:
        required: false
        type: string
        default: main

jobs:
  common:
    uses: ./.github/workflows/_dispatcher_common.yml
    with:
      app_name: ${{ inputs.app_name }}
      python_version: ${{ inputs.python_version }}

  build:
    uses: ./.github/workflows/build_docker.yml
    needs: [common]
    with:
      environment: ${{ inputs.environment }}
      repository: ${{ needs.common.outputs.repository }}
      tag: ${{ needs.common.outputs.tag }}
      dockerfile: ${{ inputs.dockerfile }}

  update_secret:
    uses: ./.github/workflows/update_json_secret_key.yml
    needs: [common, build]
    with:
      environment: ${{ inputs.environment }}
      secret_name: "${{ inputs.secret_name }}-${{ inputs.environment }}"
      secret_key: "deployment_settings.docker_image_url"
      secret_value: "${{ needs.common.outputs.repository }}:${{ needs.common.outputs.tag }}"