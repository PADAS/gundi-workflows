name: Update HCL

on:
  workflow_call:
    inputs:
      git_repository:
        required: true
        type: string
      file_location:
        required: true
        type: string
      new_value:
        required: true
        type: string
      key_name:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      ssh-key:
        required: true


jobs:
  update_terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            repository: ${{ inputs.git_repository }}
            ref: main
            ssh-key: ${{ secrets.ssh-key }}

      - name: Replace input in Terraform file
        run: |
            sed -i 's;${{ inputs.key_name }} .*;${{ inputs.key_name }} = \"${{ inputs.new_value }}\";' ${{ inputs.file_location }}

      - name: Commit changes
        run: |
            git config --global user.name "Integrations Automation"
            git config --global user.email "devops@earthranger.com"
            git add .
            IMAGE_SHORT=$(echo "${{ inputs.new_value }}" | awk -F'/' '{print $NF}')
            if git diff-index --quiet HEAD; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Updated ${{ inputs.key_name }} in HCL file (${{ inputs.environment }}: ${IMAGE_SHORT})"
            # Another integration's build may push to the same repo between our
            # checkout and push; rebase and retry instead of failing the deploy.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; rebasing onto latest and retrying..."
              git pull --rebase
            done
            echo "Failed to push after 3 attempts" >&2
            exit 1